# Mirror of .github/workflows/lint.yml. The two CIs run the same gates against
# the same scripts/check-*.sh, so a chart cannot pass on one host and fail on
# the other. Each gate's body lives in .gitlab/ci/lint-<name>.yml, one file per
# unit, matching .github/workflows/lint-<name>.yml.
#
# No rollup job here, unlike lint.yml's `lint`. That job exists only because a
# GitHub required status check pins one context name; GitLab's "Pipelines must
# succeed" evaluates the whole pipeline, and a job skipped by `rules` does not
# hold it open.
#
# Stable releases are GitHub-only. This pipeline ships prereleases to the devel
# channel of this project's package registry, never to stable.
#
# Every gate below compares against refs/heads/main, so a pipeline for main
# itself diffs main against main and skips them all. That matches GitHub, where
# lint.yml triggers on pull_request only and a direct push to main runs no lint
# either. Both hosts gate at the merge request, not after it.

stages:
  - lint
  - publish

workflow:
  rules:
    # If the pipeline is triggered by a merge request, then run the pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # If the commit is a branch and there is an open merge request, then skip the pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # If the commit is a branch, then run the pipeline.
    - if: $CI_COMMIT_BRANCH

include:
  - local: .gitlab/ci/lint-ct.yml
  - local: .gitlab/ci/lint-renovate.yml
  - local: .gitlab/ci/lint-omniroute.yml
  - local: .gitlab/ci/lint-github-app.yml
  - local: .gitlab/ci/lint-binance-trading-bot.yml
  - local: .gitlab/ci/publish-devel.yml
