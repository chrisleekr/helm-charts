name: Lint Charts

# The `lint` job at the bottom is the required status check: the "main" ruleset
# pins required_status_checks to context "lint" from the GitHub Actions app
# (integration_id 15368). The context is the JOB id, not the workflow name.
#
# Consequence: this workflow must never carry a paths filter. A workflow skipped
# by path filtering leaves its checks Pending forever and blocks the merge, while
# a JOB skipped by a conditional reports Success. Per-chart gates are therefore
# jobs here, gated on the `changes` job, so a chart the PR did not touch reports
# green instead of hanging. Their bodies live in .github/workflows/lint-<chart>.yml.
# https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks

on:
  pull_request:
    branches:
      - main

# Keyed on the PR, so a rapid second push cancels the first run's whole fan-out
# rather than holding two complete pipelines. Safe for the required check: the
# cancelled run belongs to a superseded head SHA, and the ruleset evaluates the
# `lint` context on the current one.
concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      # Underscored names on purpose: `-` is an operator in GitHub expressions,
      # so needs.changes.outputs.github-app would parse as a subtraction.
      omniroute: ${{ steps.filter.outputs.omniroute }}
      github_app: ${{ steps.filter.outputs.github_app }}
      binance_trading_bot: ${{ steps.filter.outputs.binance_trading_bot }}
      sre_platform: ${{ steps.filter.outputs.sre_platform }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed charts
        id: filter
        env:
          # A SHA, not attacker-controlled text, but routed through env rather
          # than interpolated into the script body as a matter of course.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Two-dot diff against the PR base: HEAD is the merge commit, whose
          # content is base + the PR's changes, so this is exactly the PR diff.
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # A chart's gate also reruns when its own script or workflow changes,
          # otherwise a broken gate could merge without ever executing. Every
          # list ends with this file for the same reason: a PR that only edits
          # the dispatcher would otherwise emit false everywhere, skip every
          # gate, and merge green with the rewiring unverified -- including the
          # C20/C21 assertions that exist to check this file's own wiring.
          emit() {
            name=$1
            shift
            hit=false
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              for pattern in "$@"; do
                # shellcheck disable=SC2254  # unquoted on purpose: these are globs
                case "$line" in $pattern) hit=true; break 2 ;; esac
              done
            done <<< "$changed"
            echo "$name=$hit" >> "$GITHUB_OUTPUT"
            echo "$name=$hit"
          }

          emit omniroute \
            'charts/omniroute/*' \
            'scripts/check-omniroute-render.sh' \
            'scripts/check-omniroute-memory.sh' \
            '.github/workflows/lint-omniroute.yml' \
            '.github/workflows/lint.yml'
          emit github_app \
            'charts/github-app/*' \
            'scripts/check-github-app-render.sh' \
            'scripts/check-env-parity.sh' \
            'scripts/check-env-parity.test.sh' \
            'scripts/check-policy-parity.sh' \
            'scripts/check-policy-parity.test.sh' \
            '.github/workflows/lint-github-app.yml' \
            '.github/workflows/lint.yml'
          # renovate.json and lint-renovate.yml are here because C20 inside this
          # chart's gate asserts their contents. Without them a renovate.json-only
          # PR runs the schema validator but never the assertions that the bundled
          # image trackers still exist.
          emit binance_trading_bot \
            'charts/binance-trading-bot/*' \
            'scripts/check-binance-trading-bot-render.sh' \
            '.github/workflows/lint-binance-trading-bot.yml' \
            '.github/workflows/lint-renovate.yml' \
            '.gitlab/ci/lint-binance-trading-bot.yml' \
            '.gitlab-ci.yml' \
            'renovate.json' \
            '.github/workflows/lint.yml'
          emit sre_platform \
            'charts/sre-platform/*' \
            'scripts/check-sre-platform-render.sh' \
            'scripts/check-sre-platform-env-parity.sh' \
            'scripts/check-sre-platform-env-parity.test.sh' \
            '.github/workflows/lint-sre-platform.yml' \
            '.github/workflows/sre-platform-sync.yml' \
            '.gitlab/ci/lint-sre-platform.yml' \
            '.gitlab-ci.yml' \
            '.github/workflows/lint.yml'
          emit renovate \
            'renovate.json' \
            '.github/workflows/lint-renovate.yml' \
            '.github/workflows/lint.yml'

  ct_lint:
    name: ct lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # ct lint needs fetch-depth:0 to diff against the target branch. That is
        # a local history read and needs no credentials.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up chart-testing
        # SHA-pinned like every other action here: a tag is a movable pointer,
        # and this action decides whether `ct lint` exits 0 for the four charts
        # that have no dedicated gate. renovate.json does not enable the
        # github-actions manager, so bump this by hand.
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          # Stated rather than left to the action default, which is a separate
          # moving part from the SHA pin above. Keep equal to the image tag in
          # .gitlab/ci/lint-ct.yml so both hosts lint with the same binary.
          version: v3.14.0

      - name: Run chart-testing (lint)
        # Lints every chart whose files changed since the target branch, so the
        # four charts without a dedicated gate below are covered here.
        # check-version-increment in ct.yaml enforces the Chart.yaml version bump.
        run: ct lint --config ct.yaml

      - name: Validate rendered chart schemas
        run: bash scripts/check-chart-schemas.sh

  renovate:
    name: renovate config
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-renovate.yml

  omniroute:
    name: omniroute
    needs: changes
    if: needs.changes.outputs.omniroute == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-omniroute.yml

  github_app:
    name: github-app
    needs: changes
    if: needs.changes.outputs.github_app == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-github-app.yml

  binance_trading_bot:
    name: binance-trading-bot
    needs: changes
    if: needs.changes.outputs.binance_trading_bot == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-binance-trading-bot.yml

  sre_platform:
    name: sre-platform
    needs: changes
    if: needs.changes.outputs.sre_platform == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lint-sre-platform.yml

  lint:
    # THE required status check. Keep this job id as "lint" — the ruleset pins
    # that exact context, so renaming it silently unblocks every merge.
    #
    # if: always() is load-bearing. Without it this job is skipped whenever a
    # dependency fails, and a skipped required check does not block the merge,
    # which turns the whole gate into a rubber stamp.
    needs: [changes, ct_lint, renovate, omniroute, github_app, binance_trading_bot, sre_platform]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # "skipped" is a pass: it means the PR did not touch that chart. A
          # failing `changes` job cannot hide behind it, because `changes` itself
          # then reports "failure" and is checked here too.
          bad=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::one or more lint gates did not pass"
            echo "$bad"
            exit 1
          fi
          echo "all lint gates passed"
