name: Lint Charts

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # persist-credentials:false keeps GITHUB_TOKEN out of .git/config, because
        # the renovate-config-validator step below executes third-party npm code in
        # this workspace. ct lint needs fetch-depth:0 to diff against the target
        # branch, but that is a local history read and needs no credentials.
        # Mirrors the same setting and rationale in github-app-sync.yml.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        # check-version-increment in ct.yaml enforces Chart.yaml version bump
        # for any chart whose files have changed since the target branch
        run: ct lint --config ct.yaml

      - name: Set up Node for the Renovate validator
        # renovate@44.2.3 declares engines.node ^24.11.0; the ubuntu-24.04 runner
        # defaults to Node 22.x. npm's engine-strict is false by default, so npx
        # would install anyway and run on an unsupported runtime. Pin it instead of
        # relying on that working.
        # SHA-pinned per the convention in github-app-sync.yml. Note these pins are
        # not Renovate-monitored while enabledManagers excludes github-actions, so
        # they need a manual bump.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate renovate.json
        # Renovate fails silently on a bad config: it warns in its own logs and
        # stops opening PRs, so no PR ever turns red. Since renovate.json grants
        # auto-merge, catch the breakage here instead. Verified to reject unknown
        # keys, malformed JSON, wrong value types, the deprecated fileMatch name,
        # and invalid regex. It does NOT check enum values (a bogus bumpType
        # passes), so this is a schema gate, not a semantic one.
        #
        # The filename is passed explicitly on purpose: with no argument the
        # validator only scans default locations "if files exist" and exits 0 when
        # it finds none (renovatebot/renovate#16025), so deleting or renaming
        # renovate.json would silently pass. Version is pinned rather than
        # floating on latest since this step executes third-party npm code; a
        # schema change in a newer Renovate turns this red, which is the signal
        # to bump the pin.
        run: npx --yes --package renovate@44.2.3 -- renovate-config-validator --strict renovate.json

      - name: omniroute memory invariant
        # values.yaml requires limits.memory to clear the V8 heap ceiling by the
        # >=250Mi that lives outside the heap. Breaking it fails quietly: V8
        # aborts and the container ends up exiting 0 ("Completed"), which never
        # reaches CrashLoopBackOff and so fires no crash-loop alert. See issue #53.
        # Enforced here because appVersion patch bumps auto-merge with no human
        # reading the values.yaml comment.
        run: |
          set -euo pipefail
          chart=charts/omniroute
          rendered="${RUNNER_TEMP:-/tmp}/omniroute.yaml"
          helm template "$chart" -f "$chart/ci/ct-values.yaml" > "$rendered"
          cap=$(yq e 'select(.kind == "ConfigMap") | .data.OMNIROUTE_MEMORY_MB' "$rendered")
          limit=$(yq e 'select(.kind == "Deployment") | .spec.template.spec.containers[0].resources.limits.memory' "$rendered")
          # yq prints "null" for a missing key and bash arithmetic reads that as 0,
          # which would pass this check. Reject non-numeric up front so a renamed or
          # deleted key fails closed. Also catches multi-line (duplicate resource).
          require_int() {
            case "$2" in ''|*[!0-9]*)
              echo "::error file=$chart/values.yaml::$1 is not a plain integer: '$2'"; exit 1 ;;
            esac
          }
          require_int OMNIROUTE_MEMORY_MB "$cap"
          case "$limit" in
            *Gi) mib=${limit%Gi}; require_int limits.memory "$mib"; limit_mi=$(( mib * 1024 )) ;;
            *Mi) mib=${limit%Mi}; require_int limits.memory "$mib"; limit_mi=$mib ;;
            *) echo "::error file=$chart/values.yaml::unhandled limits.memory unit: '$limit'"; exit 1 ;;
          esac
          headroom=$(( limit_mi - cap ))
          echo "heap ceiling ${cap}Mi, limit ${limit_mi}Mi, headroom ${headroom}Mi"
          if [ "$headroom" -lt 250 ]; then
            echo "::error file=$chart/values.yaml::limits.memory ($limit) must exceed OMNIROUTE_MEMORY_MB ($cap) by >=250Mi, got ${headroom}Mi"
            exit 1
          fi

      - name: Render github-app feature matrix
        # Exercises every conditional branch in the chart so a template error
        # in any mode surfaces on the PR, not after publish. Uses only static,
        # literal --set flags — no untrusted input from github.* contexts.
        run: |
          chart=charts/github-app
          set -euo pipefail
          # 1. Defaults — daemon-only dispatch, no ephemeral spawn knobs overridden.
          helm template "$chart" > /dev/null
          # 2. Bedrock provider path.
          helm template "$chart" \
            --set config.provider=bedrock \
            --set config.awsRegion=us-east-1 \
            --set config.model=us.anthropic.claude-sonnet-4-5-v1:0 > /dev/null
          # 3. In-chart Postgres + Valkey + RBAC (rbac.create=true now provisions
          #    a Role for ephemeral daemon Pod spawning — see upstream PR #35).
          helm template "$chart" \
            --set postgres.enabled=true --set valkey.enabled=true \
            --set rbac.create=true > /dev/null
          # 4. External Postgres + Valkey (literal password path).
          helm template "$chart" \
            --set postgres.external.enabled=true \
            --set postgres.external.host=pg \
            --set postgres.external.username=u \
            --set postgres.external.database=d \
            --set postgres.external.password=p \
            --set valkey.external.enabled=true \
            --set valkey.external.host=r \
            --set valkey.external.auth.password=p > /dev/null
          # 5. User-supplied URLs (neither in-chart nor external enabled).
          helm template "$chart" \
            --set config.databaseUrl=postgres://u:p@h/d \
            --set config.valkeyUrl=redis://h:6379 > /dev/null
          # 6. Daemon pools: default (no DinD) + docker-heavy (rootless DinD).
          helm template "$chart" \
            --values "$chart/ci/daemon-pools-values.yaml" > /dev/null
          # 7. Ephemeral daemon scale-up (chart-managed RBAC): namespace stays at
          #    the release namespace so role.yaml's cross-namespace guard is happy.
          helm template "$chart" \
            --set rbac.create=true \
            --set config.ephemeralDaemon.orchestratorPublicUrl=ws://orchestrator.example:3002/ws \
            --set config.ephemeralDaemon.spawnQueueThreshold=5 > /dev/null
          # 8. Ephemeral daemon scale-up (operator-managed RBAC): rbac.create=false
          #    releases the namespace lock, so cross-namespace spawn is allowed.
          helm template "$chart" \
            --set rbac.create=false \
            --set config.ephemeralDaemon.namespace=agents > /dev/null

      - name: github-app env-parity self-test
        # Exercises the gate's comparison logic against a synthetic contract
        # derived from the chart, so the logic has coverage even while the live
        # contract at v<appVersion> 404s (bootstrap window) and the gate SKIPs.
        run: bash scripts/check-env-parity.test.sh

      - name: github-app env-parity gate
        # Fails when the chart's ConfigMap/Secret env surface drifts from
        # github-app's env-contract.json (published at v<appVersion>). Catches the
        # case helm template cannot: a config.ts var the chart never mirrored.
        # Skips (does not fail) for appVersions predating the contract. jq + yq are
        # preinstalled on GitHub-hosted ubuntu runners.
        run: bash scripts/check-env-parity.sh
