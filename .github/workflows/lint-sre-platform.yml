name: Lint sre-platform

on:
  workflow_call:

jobs:
  gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Render feature matrix
        run: bash scripts/check-sre-platform-render.sh

      - name: Environment-parity self-test
        run: bash scripts/check-sre-platform-env-parity.test.sh

      - name: Environment-parity gate
        run: bash scripts/check-sre-platform-env-parity.sh
