# Default values for binance-trading-bot.
# Upstream: https://github.com/chrisleekr/binance-trading-bot

# ──────────────────────────────── TOPOLOGY ────────────────────────────────
# One image, four roles. "all" runs the api, the live worker and the study
# consumer in a single process (upstream's default single-box layout).
# "split" runs one Deployment per role: api, worker, study.
topology: all

image:
  repository: chrisleekr/binance-trading-bot
  tag: ""                                       # Defaults to Chart appVersion.
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Applies only to roles that do not run the live trading loop, which means the
# api and study roles under topology=split. Under topology=all the single pod
# runs the worker in-process, so anything above 1 is rejected at render time
# rather than silently double-trading.
replicaCount: 1

# Per-role overrides layered on the top-level replicaCount/resources. The roles
# that trade ("all" and "worker") reject a replicaCount above 1: upstream has no
# distributed lock, so a second replica places the same orders twice. 0 is
# honoured as written, so it is the way to stop a role without uninstalling.
roles:
  all: {}
  api: {}
  worker: {}
  study: {}

# ──────────────────────────────── IDENTITY ────────────────────────────────
# Exact browser origin, "scheme://host[:port]". Upstream's WEB_ORIGIN is an
# allowlist with no wildcard support and gates CORS, Better Auth CSRF and the
# WebSocket upgrade, so a wrong value fails at runtime, not at install. Left
# empty it falls back to the first ingress host; with neither, the render fails.
webOrigin: ""
# Advertised base URL for links the app generates. Defaults to webOrigin.
publicWebUrl: ""

auth:
  # Must be >= 32 characters; the app refuses to boot below that. Empty
  # auto-generates one and reuses the value already in the cluster on upgrade.
  secret: ""

# Bring your own Secret instead of letting the chart manage credentials, which
# is what GitOps setups want since the lookup-based generation above cannot run
# during a server-side diff. Must contain AUTH_SECRET, DATABASE_URL, REDIS_URL,
# plus POSTGRES_PASSWORD / VALKEY_PASSWORD when the bundled datastores are on,
# plus OTEL_EXPORTER_OTLP_HEADERS when otlp.headers is used without the bundled
# collector: this Secret replaces the chart's own, so a key missing here is not
# set anywhere, and a missing OTLP auth header silently drops every trace.
existingSecret: ""

# ──────────────────────────────── RUNTIME ─────────────────────────────────
config:
  nodeEnv: production
  logLevel: info
  # Upstream tunes these for local SSD. Network-replicated CSI makes the
  # degraded persist path the steady state, so the defaults here are relaxed.
  tickPersistTimeoutMs: 300
  tickConcurrency: 8
  klineConcurrency: 3

# Extra literal env vars appended to every app container.
extraEnv: []
# - name: STUDY_CPU_SHARE
#   value: "0.5"

# ──────────────────────────────── MIGRATIONS ──────────────────────────────
# The image entrypoint migrates on boot, and concurrent pods race on the
# migrations table. The chart runs them once in a pre-install/pre-upgrade hook
# Job and sets SKIP_MIGRATIONS=1 on every app workload instead.
migrations:
  enabled: true
  # How long the init container waits for the database to accept connections
  # before failing with a readable message. Covers the bundled StatefulSet's
  # first start; raise it if an external database is slow to come up.
  #
  # Both numbers here live inside a budget Helm sets, not just each other:
  # `helm install --timeout` defaults to 5m0s and applies to each hook Job, so
  # the whole pre-install chain (image pull, PVC bind, initdb, this wait, then
  # the migration) has to finish inside 300s or Helm abandons a Job that may
  # still be running. Raise these only together with a larger --timeout.
  databaseWaitSeconds: 120
  # Hard ceiling on the whole Job. backoffLimit only counts pod failures, and a
  # pod waiting on an unreachable database never produces one, so without this
  # a bad DSN hangs the release until Helm's own timeout. Kept above
  # databaseWaitSeconds plus the migration runtime so the wait loop can report
  # why, and below Helm's 300s default so the Job fails with a diagnosable
  # DeadlineExceeded rather than Helm walking away from it.
  activeDeadlineSeconds: 240
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# ──────────────────────────────── DATASTORES ──────────────────────────────
# TimescaleDB is the schema's persistence layer, not an optional extension, so
# an external Postgres must have it installed.
#
# The bundled Postgres is rendered as a Helm pre-install/pre-upgrade hook so it
# exists before the migration Job runs. Three consequences of that: `helm upgrade`
# recreates the StatefulSet, which restarts the database (the PVC is retained,
# so data survives); `helm uninstall` leaves the StatefulSet, Service and PVC
# behind for you to delete; and persistence.size below is fixed at install time,
# because recreating the StatefulSet reattaches the existing PVC at its original
# size instead of raising the usual validation error. Set postgres.enabled=false
# and point externalDatabase.url at a managed instance to avoid all three.
postgres:
  enabled: true
  # Also the image for the migration Job's wait-for-database init container,
  # which runs pg_isready against DATABASE_URL. That container renders whether
  # or not the bundled database is enabled, so this stanza still has to point
  # at a pullable image when postgres.enabled is false.
  image:
    repository: timescale/timescaledb
    tag: 2.29.2-pg17
    pullPolicy: IfNotPresent
  auth:
    username: binance_trading_bot
    database: binance_trading_bot
    password: ""                                # Empty auto-generates and persists.
  service:
    port: 5432
  persistence:
    storageClass: ""                            # Empty uses the cluster default.
    accessModes: [ReadWriteOnce]
    # Fixed at install time. Raising it on an existing release renders cleanly
    # and does nothing; resize the PVC directly instead.
    size: 20Gi
  # Probe budget for the first boot, at 5s per attempt. initdb plus the
  # TimescaleDB extension setup runs once and can take minutes on slow storage;
  # without the startup probe covering it the liveness probe kills the container
  # mid-initdb and the pod crash-loops. 120 = 10 minutes.
  startupFailureThreshold: 120
  # Helm replaces this list wholesale, so an override must restate every entry it
  # still wants. shared_preload_libraries likewise overrides postgresql.conf
  # rather than appending, so timescaledb has to be named here: the app creates
  # hypertables against it and will not start without it.
  args:
    - -c
    - max_connections=50
    # A migration creates the pg_stat_statements extension, but the module only
    # records once preloaded, so without this the view errors on every read.
    # compute_query_id defaults to `auto` and activates it on load.
    - -c
    - shared_preload_libraries=timescaledb,pg_stat_statements
  # Uncomment to split planning time from execution time. Useful when a server
  # burns CPU that execution time alone does not account for. Off by default:
  # the PostgreSQL docs warn it may cost noticeably at high statement rates.
  #  - -c
  #  - pg_stat_statements.track_planning=on
  # Uncomment to trade durability for tick-persist latency, which is the app's
  # hot path. Off means Postgres acknowledges a commit before its WAL reaches
  # disk, so a node or database crash silently loses trades the app already
  # treated as recorded. That is a deliberate choice, not a default.
  #  - -c
  #  - synchronous_commit=off
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Used when postgres.enabled is false. Full DSN so no credential ever has to be
# reassembled from parts, including sslmode and any driver options.
#
# Worth contrasting: the bundled StatefulSet above ships no server certificate,
# so the DSN the chart builds for it uses sslmode=disable and the password and
# every row cross the pod network in plaintext. That is inside the cluster and
# is the same posture as the bundled Valkey, but if your threat model includes
# the pod network, run a database with TLS and point this at it with
# sslmode=require.
externalDatabase:
  url: ""

valkey:
  enabled: true
  # Probe budget for the first boot, at 5s per attempt. Valkey answers LOADING
  # while it reads an existing RDB back, and the liveness probe would otherwise
  # kill it partway and restart the same load. 60 = 5 minutes.
  startupFailureThreshold: 60
  image:
    repository: valkey/valkey
    tag: 9-alpine
    pullPolicy: IfNotPresent
  auth:
    password: ""                                # Empty auto-generates and persists.
  service:
    port: 6379
  persistence:
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 2Gi
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 192Mi

externalRedis:
  url: ""

# ──────────────────────────────── STORAGE ─────────────────────────────────
# BACKUP_DIR. The worker writes database dumps here and the api lists them, so
# in split topology both mount the same claim and the access mode must allow
# multi-node writes (ReadWriteMany), which the chart enforces at render time.
#
# This claim carries no helm.sh/resource-policy, so `helm uninstall` deletes it
# and the dumps in it. That is deliberately not the bundled database's
# behaviour: its PVC comes from volumeClaimTemplates, which Kubernetes never
# garbage-collects, so Postgres data survives an uninstall and the backups do
# not. Copy anything you need out first, or set existingClaim to a PVC this
# release does not own.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 10Gi
  mountPath: /backups

# ──────────────────────────────── NETWORK ─────────────────────────────────
service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  # Enabling the ingress with an empty tls list fails the render. Set this only
  # when TLS terminates in front of the ingress controller, and set webOrigin to
  # the https:// origin yourself, because the fallback derives the scheme from
  # ingress.tls and would give you http://.
  allowInsecure: false
  annotations:
    # The event stream is a long-lived WebSocket; the nginx default 60s read
    # timeout tears it down every minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Database dump restores are uploaded through this path. The annotation is
    # per-Ingress, not per-path, so this raises the limit on every URL on the
    # host, and nginx buffers the body before the app sees it. Lower it if you
    # do not use restore; the controller default is 1m.
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
  hosts:
    - host: chart-example.local                 # Replace with your real host.
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: binance-trading-bot-tls
  #    hosts:
  #      - chart-example.local

# Ports 9100/9101 serve /metrics and /readyz with no authentication, and a
# Service is not a firewall. This policy is the only thing keeping them off the
# pod network. Port 3000 stays reachable from everywhere.
#
# Covers the app pods only. The bundled Collector carries its own policy keyed
# on otelCollector.enabled, independent of this flag, because its OTLP
# receivers are unauthenticated and it forwards using your vendor token.
networkPolicy:
  enabled: false
  # Raw NetworkPolicyPeer entries, passed through untouched.
  adminFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: monitoring

# ──────────────────────────────── OBSERVABILITY ───────────────────────────
metrics:
  serviceMonitor:
    enabled: false                              # Needs the Prometheus Operator CRDs.
    interval: 30s
    scrapeTimeout: ""
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    # Restricts every built-in expression to this release's own targets, via a
    # label the ServiceMonitor above stamps on each series. The metric names are
    # generic enough that a second release, or an unrelated exporter, would
    # otherwise fire these alerts. Needs serviceMonitor.enabled, and the render
    # fails rather than leaving the alerts silently unmatchable. Turn off if you
    # scrape these pods some other way; additionalRules are never rewritten.
    scopeToChartTargets: true
    # Only metrics the v1.0.0 image actually exports. See the README for the
    # failure modes that have no alert coverage.
    #
    # `for` is how long the expression must already hold before the alert
    # fires. It is not the same as the counter lookback: droppedSpans and
    # droppedLogs use increase(...[15m]), and that 15m window is fixed in the
    # template. Disabling all four with additionalRules empty is rejected at
    # render time, because an empty rule list is invalid to the CRD.
    rules:
      workerMembersNotReady:
        enabled: true
        for: 10m
        severity: warning
      binanceApiWeightHigh:
        enabled: true
        threshold: 1000
        for: 5m
        severity: warning
      droppedSpans:
        enabled: true
        threshold: 0
        for: 15m
        severity: warning
      droppedLogs:
        enabled: true
        threshold: 0
        for: 15m
        severity: warning
    # Operator-owned rules appended verbatim to the same group.
    additionalRules: []

# Bundled OpenTelemetry Collector. Tail sampling needs a collector because the
# in-process head sampler cannot see whether a trace ended in an error.
otelCollector:
  enabled: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.158.0
    pullPolicy: IfNotPresent
  replicaCount: 1
  tailSampling:
    # Traces slower than this are always kept.
    latencyThresholdMs: 1000
    # Sampling rate for everything that is neither slow nor failed.
    baselinePercentage: 10
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# External OTLP backend. With otelCollector.enabled the collector forwards here;
# without it the app exports directly. Both empty disables tracing export, which
# is how upstream treats an unset endpoint.
otlp:
  endpoint: ""
  headers: ""                                   # "key=value,key2=value2".

# ──────────────────────────────── WORKLOAD ────────────────────────────────
serviceAccount:
  create: true
  # No template in this chart calls the Kubernetes API, so the pods have no use
  # for a projected token. Handing one to an internet-facing process that parses
  # untrusted HTTP and WebSocket input buys an attacker API-server reachability
  # and an identity to probe RBAC with, for no functional gain.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as 1000:1000. fsGroup is what makes the backups volume
# writable when the CSI driver formats it root-owned.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  # Required for admission into a namespace enforcing the "restricted" Pod
  # Security Standard, which otherwise rejects every pod this chart creates.
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  # HOME=/tmp in the image, so the only writable paths needed are the emptyDir
  # at /tmp and the backups volume.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    memory: 2Gi
  requests:
    cpu: 600m
    memory: 512Mi

# The admin server binds ADMIN_HOST, which the chart forces to 0.0.0.0 so the
# kubelet can reach it. Probes hit the admin port, never port 3000, because
# 3000 only answers /healthz.
startupProbe:
  periodSeconds: 5
  failureThreshold: 24
readinessProbe:
  periodSeconds: 10
livenessProbe:
  periodSeconds: 30

terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
