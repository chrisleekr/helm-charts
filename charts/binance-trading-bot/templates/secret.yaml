{{- if not .Values.existingSecret }}
{{- $name := include "binance-trading-bot.fullname" . }}
{{/*
Generated credentials are read back from the cluster so an upgrade does not roll
a new AUTH_SECRET (which invalidates every session) or a new database password
(which locks the app out of its own volume). lookup returns nothing during a
server-side diff, so GitOps setups should use existingSecret instead.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $prior := dict }}
{{- if $existing }}{{- $prior = $existing.data }}{{- end }}

{{/* AUTH_SECRET: explicit > persisted > generated. Upstream rejects < 32 chars. */}}
{{- $auth := "" }}
{{- if .Values.auth.secret }}
{{- $auth = .Values.auth.secret }}
{{- else if hasKey $prior "AUTH_SECRET" }}
{{- $auth = index $prior "AUTH_SECRET" | b64dec }}
{{- else }}
{{- $auth = randAlphaNum 48 }}
{{- end }}
{{- if lt (len $auth) 32 }}
{{- fail "auth.secret must be at least 32 characters; the application refuses to boot below that." }}
{{- end }}

{{/*
Both passwords are interpolated into the userinfo part of a URL below, and this
chart does not percent-encode them. Generated values are alphanumeric so they
are always safe; an explicit value is validated instead, because a password
containing "/" or "?" silently truncates the host or drops the sslmode
parameter rather than failing loudly.
*/}}
{{- $pgPassword := "" }}
{{- if .Values.postgres.enabled }}
{{- if .Values.postgres.auth.password }}
{{- $pgPassword = .Values.postgres.auth.password }}
{{- include "binance-trading-bot.assertUrlSafe" (dict "key" "postgres.auth.password" "value" $pgPassword) }}
{{- else if hasKey $prior "POSTGRES_PASSWORD" }}
{{- $pgPassword = index $prior "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}

{{- $valkeyPassword := "" }}
{{- if .Values.valkey.enabled }}
{{- if .Values.valkey.auth.password }}
{{- $valkeyPassword = .Values.valkey.auth.password }}
{{- include "binance-trading-bot.assertUrlSafe" (dict "key" "valkey.auth.password" "value" $valkeyPassword) }}
{{- else if hasKey $prior "VALKEY_PASSWORD" }}
{{- $valkeyPassword = index $prior "VALKEY_PASSWORD" | b64dec }}
{{- else }}
{{- $valkeyPassword = randAlphaNum 32 }}
{{- end }}
{{- end }}

{{- $databaseUrl := "" }}
{{- if .Values.postgres.enabled }}
{{/* Same reason as the password: an "@" or "/" here relocates the authority. */}}
{{- include "binance-trading-bot.assertUrlSafe" (dict "key" "postgres.auth.username" "value" .Values.postgres.auth.username) }}
{{- include "binance-trading-bot.assertUrlSafe" (dict "key" "postgres.auth.database" "value" .Values.postgres.auth.database) }}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:%v/%s?sslmode=disable" .Values.postgres.auth.username $pgPassword (include "binance-trading-bot.componentName" (dict "ctx" . "suffix" "postgres")) .Values.postgres.service.port .Values.postgres.auth.database }}
{{- else }}
{{- $databaseUrl = required "externalDatabase.url is required when postgres.enabled is false." .Values.externalDatabase.url }}
{{- end }}

{{- $redisUrl := "" }}
{{- if .Values.valkey.enabled }}
{{- $redisUrl = printf "redis://:%s@%s:%v/0" $valkeyPassword (include "binance-trading-bot.componentName" (dict "ctx" . "suffix" "valkey")) .Values.valkey.service.port }}
{{- else }}
{{- $redisUrl = required "externalRedis.url is required when valkey.enabled is false." .Values.externalRedis.url }}
{{- end }}
{{/*
Same hook annotations as the ConfigMap: the migration Job needs DATABASE_URL
before the release phase applies plain resources.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "binance-trading-bot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  AUTH_SECRET: {{ $auth | b64enc | quote }}
  DATABASE_URL: {{ $databaseUrl | b64enc | quote }}
  REDIS_URL: {{ $redisUrl | b64enc | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  VALKEY_PASSWORD: {{ $valkeyPassword | b64enc | quote }}
  {{- end }}
  {{- if and .Values.otlp.headers (not .Values.otelCollector.enabled) }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.otlp.headers | b64enc | quote }}
  {{- end }}
{{- end }}
