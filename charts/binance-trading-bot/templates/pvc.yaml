{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{/*
BACKUP_DIR. In split topology the api lists what the worker wrote, so both mount
this claim and accessModes has to allow multi-node writes. ReadWriteOnce binds
the volume to one node, so the second pod stays Pending on a multi-node cluster
while the rollout still reports the first one healthy. Fail at render time
instead: a Deployment that never schedules is not visible in `helm status`.

No helm.sh/resource-policy, so `helm uninstall` takes this claim and the dumps
in it, unlike the bundled Postgres volume. Documented in values.yaml.
*/}}
{{- if and (eq .Values.topology "split") (not (has "ReadWriteMany" .Values.persistence.accessModes)) }}
{{- fail (printf "topology=split mounts the backups claim from both api and worker, so persistence.accessModes must include ReadWriteMany. Got %v. Set persistence.accessModes: [ReadWriteMany] with a storage class that supports it, point persistence.existingClaim at a claim you manage, or set persistence.enabled=false to give each role an emptyDir." .Values.persistence.accessModes) }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "binance-trading-bot.componentName" (dict "ctx" . "suffix" "backups") }}
  labels:
    {{- include "binance-trading-bot.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
