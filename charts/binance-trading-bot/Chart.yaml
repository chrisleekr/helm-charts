apiVersion: v2
name: binance-trading-bot
description: A Helm chart for Binance Trading Bot - a self-hosted automated crypto trading bot
type: application
keywords:
  - bot
  - trading-bot
  - cryptocurrency
  - binance
  - binance-api
  - crypto-trading
  - grid-trading
  - binance-trading-bot
# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
#
# 1.0.0 is a full rewrite of the chart for upstream v1.0.0, which replaced the
# application the 0.x chart deployed. There is no in-place upgrade path from 0.x.
version: 1.1.0
# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
#
# Upstream tags with a leading "v", so the tag string is "v1.0.0", not "1.0.0".
appVersion: "v1.0.0"
kubeVersion: ">= 1.31.0"
sources:
  - https://github.com/chrisleekr/binance-trading-bot
maintainers:
  - name: Chris Lee
    url: https://github.com/chrisleekr
annotations:
  # https://artifacthub.io/docs/topics/annotations/helm/
  # binance-trading-bot-sync.yml prepends an entry here on every release sync,
  # so this list must exist and parse as a YAML list before the first sync runs.
  artifacthub.io/changes: |
    - kind: added
      description: "Track upstream releases automatically: a chart bump PR is now opened on each binance-trading-bot release. Adds this Artifact Hub changelog."
