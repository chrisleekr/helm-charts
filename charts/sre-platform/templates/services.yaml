apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-platform.componentName" (dict "ctx" . "suffix" "api") }}
  labels:
    {{- include "sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sre-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-platform.componentName" (dict "ctx" . "suffix" "dashboard") }}
  labels:
    {{- include "sre-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.service.dashboard.type }}
  ports:
    - name: http
      port: {{ .Values.service.dashboard.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sre-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
