apiVersion: v2
name: edge-proxy
description: >-
  A Helm chart for Edge Proxy, a policy-enforcing reverse proxy that sits between a CDN and the load balancer or gateway that routes your services, and its admin service
type: application
version: 0.6.3
# matchLabelKeys in the edge topology spread is on by default from 1.27.
kubeVersion: ">=1.27.0-0"
appVersion: "1.3.0"
home: https://github.com/chrisleekr/edge-proxy
sources:
  - https://github.com/chrisleekr/edge-proxy
maintainers:
  - name: Chris Lee
    url: https://github.com/chrisleekr
# Optional Valkey for rate-limit state, off by default. The project-maintained
# chart replaced Bitnami's after Bitnami stopped publishing free images.
dependencies:
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
keywords:
  - reverse-proxy
  - rate-limiting
  - waf
  - kubernetes
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: "Sync to edge-proxy v1.3.0: **admin:** add a Traffic map of requests by viewer country (#30); **admin:** show crawler range refresh status and alert when a source goes stale (#29). Release notes: https://github.com/chrisleekr/edge-proxy/releases/tag/v1.3.0"
    - kind: changed
      description: "Sync to edge-proxy v1.2.0: **admin:** add attention acks, autopilot case switches and DRAIN_DELAY (#24); **edge:** add trusted client allowlist (snapshot schema 6) (#23); **ui:** rework admin navigation and add allowlist, autopilot and attention controls (#25); **loadtest:** replace config_rules in the autopilot load-full setup (#21). Release notes: https://github.com/chrisleekr/edge-proxy/releases/tag/v1.2.0"
    - kind: fixed
      description: "EdgeProxySnapshotPollErrors fires when an edge has 3 or more failed polls in 5 minutes for 5 minutes, not on a single failed poll or an admin restart shorter than about 2 minutes."
    - kind: added
      description: "Optional autopilot runner Deployment (autopilot.enabled), admin /metrics on port 9091 with ServiceMonitor scraping, admin alerts, and admin.alertmanagerURL."
    - kind: changed
      description: "Raise the edge memory limit to 512Mi and GOMEMLIMIT to 460MiB, and cap the log shipper sink at concurrency 2 with a 1000-event buffer."
    - kind: changed
      description: "Sync to edge-proxy v1.1.0: admin anomaly notifications, overlay rules and the autopilot API (#16); the autopilot runner image (#17); edge client signals and limits (#15); OpenTelemetry tracing (#12); admin UI pages (#18). Release notes: https://github.com/chrisleekr/edge-proxy/releases/tag/v1.1.0"
    - kind: changed
      description: "Sync to edge-proxy v1.0.0: single UPSTREAM_URL edge, observed routes, and admin bootstrap (backend) (#2); **ui:** redesign admin UI with dashboard, routes view and docs screenshot gate (#3). Release notes: https://github.com/chrisleekr/edge-proxy/releases/tag/v1.0.0"
    - kind: added
      description: "Initial release."
