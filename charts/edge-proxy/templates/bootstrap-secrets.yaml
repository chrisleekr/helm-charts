{{- if .Values.bootstrap.generateSecrets }}
{{- $name := include "edge-proxy.componentName" (dict "ctx" . "suffix" "bootstrap") }}
{{- $pg := and .Values.postgres.cnpg.enabled (not .Values.postgres.cnpg.runtimeRoleSecret) }}
{{- $logs := and .Values.logShipper.enabled (not .Values.logShipper.existingSecret) }}
{{- /*
A hook, so the Secrets exist before the pods and the CloudNativePG Cluster that
read them. Under Argo CD it runs as a PreSync hook. The Job creates the Secrets
through the API rather than rendering them, because Helm's rand and lookup
would give a new value on every Argo CD sync. Helm does not own them, so they
survive uninstall and an upgrade never rotates them.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# create only: the Job never reads a Secret, so it cannot leak an existing one.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "edge-proxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: generate
          image: {{ printf "%s:%s" .Values.bootstrap.image.repository .Values.bootstrap.image.tag | quote }}
          imagePullPolicy: {{ .Values.bootstrap.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: EDGE_SECRET
              value: {{ include "edge-proxy.generatedEdgeSecret" . | quote }}
            - name: ADMIN_SECRET
              value: {{ include "edge-proxy.generatedAdminSecret" . | quote }}
            - name: PG_SECRET
              value: {{ if $pg }}{{ include "edge-proxy.pgRuntimeSecret" . | quote }}{{ else }}""{{ end }}
            - name: LOGS_SECRET
              value: {{ if $logs }}{{ include "edge-proxy.generatedLogsSecret" . | quote }}{{ else }}""{{ end }}
            - name: PG_USER
              value: {{ .Values.migrations.runtimeRole | quote }}
            - name: NAME
              value: {{ include "edge-proxy.name" . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              ns=$(cat "$sa/namespace")
              # 40 characters of [A-Za-z0-9], about 238 bits.
              rand() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40; }
              # create <name> reads the Secret's JSON from stdin. 409 means it
              # already exists, and an existing Secret is never replaced, so
              # upgrades and reinstalls keep their values. Checking a marker on
              # it would add nothing: whoever can create a Secret here can forge
              # the marker, and can mount any Secret here in a pod anyway.
              create() {
                code=$(curl -sS --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" \
                  -H 'Content-Type: application/json' -o /tmp/response -w '%{http_code}' \
                  -X POST "https://kubernetes.default.svc/api/v1/namespaces/$ns/secrets" --data-binary @-)
                case $code in
                  201) echo "created Secret $1" ;;
                  409) echo "kept existing Secret $1" ;;
                  *) echo "creating Secret $1 failed with HTTP $code:"; cat /tmp/response; exit 1 ;;
                esac
              }
              # No app.kubernetes.io/instance label: Argo CD tracks by that label
              # in some setups and would prune a Secret it did not render.
              create "$EDGE_SECRET" <<JSON
              {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
               "metadata": {"name": "$EDGE_SECRET", "labels": {"app.kubernetes.io/name": "$NAME", "app.kubernetes.io/component": "generated"}},
               "stringData": {"EDGE_SERVICE_TOKEN": "$(rand)"}}
              JSON
              create "$ADMIN_SECRET" <<JSON
              {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
               "metadata": {"name": "$ADMIN_SECRET", "labels": {"app.kubernetes.io/name": "$NAME", "app.kubernetes.io/component": "generated"}},
               "stringData": {"ADMIN_PASSWORD": "$(rand)",
                              "AUDIT_HMAC_KEY_ID": "generated-$(date -u +%Y-%m)", "AUDIT_HMAC_KEY": "$(head -c 32 /dev/urandom | base64)"}}
              JSON
              if [ -n "$LOGS_SECRET" ]; then
                create "$LOGS_SECRET" <<JSON
              {"apiVersion": "v1", "kind": "Secret", "type": "Opaque",
               "metadata": {"name": "$LOGS_SECRET", "labels": {"app.kubernetes.io/name": "$NAME", "app.kubernetes.io/component": "generated"}},
               "stringData": {"LOG_INGEST_TOKEN": "$(rand)"}}
              JSON
              fi
              if [ -n "$PG_SECRET" ]; then
                # cnpg.io/reload makes the operator apply a later password change.
                create "$PG_SECRET" <<JSON
              {"apiVersion": "v1", "kind": "Secret", "type": "kubernetes.io/basic-auth",
               "metadata": {"name": "$PG_SECRET", "labels": {"app.kubernetes.io/name": "$NAME", "app.kubernetes.io/component": "generated", "cnpg.io/reload": "true"}},
               "stringData": {"username": "$PG_USER", "password": "$(rand)"}}
              JSON
              fi
          resources:
            {{- toYaml .Values.bootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
