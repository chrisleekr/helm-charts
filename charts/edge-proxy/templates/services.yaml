apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-proxy.componentName" (dict "ctx" . "suffix" "edge") }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  selector:
    {{- include "edge-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: edge
  ports:
    - name: http
      port: 8080
      targetPort: http
    # /metrics for scraping. /livez and /readyz are here too; they reveal
    # nothing beyond readiness.
    - name: internal
      port: 9090
      targetPort: internal
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-proxy.componentName" (dict "ctx" . "suffix" "admin") }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    {{- include "edge-proxy.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: 8081
      targetPort: http
