{{- if .Values.metrics.prometheusRule.enabled }}
{{- if not .Values.metrics.serviceMonitor.enabled }}
{{- fail "metrics.prometheusRule.enabled needs metrics.serviceMonitor.enabled: the alerts match the service label that ServiceMonitor scraping adds, so without it they would never fire." }}
{{- end }}
{{- /*
The alerts from edge-proxy's monitoring guide. The Prometheus Operator puts
namespace and service labels on every series it scrapes through a
ServiceMonitor, so $sel and $adminSel limit each expression to this release's
edges or admin; the metric names alone would also match another release.
*/}}
{{- $svc := include "edge-proxy.componentName" (dict "ctx" . "suffix" "edge") }}
{{- $sel := printf "namespace=%q,service=%q" .Release.Namespace $svc }}
{{- $adminSel := printf "namespace=%q,service=%q" .Release.Namespace (include "edge-proxy.componentName" (dict "ctx" . "suffix" "admin")) }}
{{- $runbooks := "https://github.com/chrisleekr/edge-proxy/blob/main/docs/operate/runbooks.md" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $svc }}
  labels:
    {{- include "edge-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $svc }}
      rules:
        - alert: EdgeProxyNotReady
          expr: edge_ready{ {{- $sel -}} } == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Edge {{ "{{" }} $labels.pod {{ "}}" }} has no policy loaded"
            runbook_url: {{ $runbooks }}#edge-not-ready
        - alert: EdgeProxySnapshotVersionSkew
          expr: max(edge_snapshot_version{ {{- $sel -}} }) != min(edge_snapshot_version{ {{- $sel -}} })
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Edges run different policy versions; some cannot reach admin
            runbook_url: {{ $runbooks }}#admin-or-postgres-down
        # One or two failed polls, such as during an admin restart, are not an
        # outage. increase() extrapolates over the window, so 2 failures can
        # read about 2.4 while 3 read at least 3: >= 3 fires on the third.
        - alert: EdgeProxySnapshotPollErrors
          expr: increase(edge_snapshot_poll_errors_total{ {{- $sel -}} }[5m]) >= 3
          labels:
            severity: warning
          annotations:
            summary: "Edge {{ "{{" }} $labels.pod {{ "}}" }} cannot poll admin; it keeps its current policy"
            runbook_url: {{ $runbooks }}#admin-or-postgres-down
        - alert: EdgeProxySnapshotRejected
          expr: increase(edge_snapshot_rejected_total{ {{- $sel -}} }[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: An edge refused a policy admin served; check edge logs and that versions match
        - alert: EdgeProxyValkeyErrors
          expr: rate(edge_valkey_errors_total{ {{- $sel -}} }[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: Rate limits are on their fail_mode
            runbook_url: {{ $runbooks }}#valkey-down
        - alert: EdgeProxyTokensPassUnchecked
          expr: increase(edge_auth_total{ {{- $sel -}} ,result="pass_no_keys"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: Tokens pass unchecked because signing keys were never fetched
            runbook_url: {{ $runbooks }}#identity-provider-down
        - alert: EdgeProxyRunningFromBootstrap
          expr: edge_bootstrap_age_seconds{ {{- $sel -}} } > 0
          labels:
            severity: warning
          annotations:
            summary: "Edge {{ "{{" }} $labels.pod {{ "}}" }} serves a bootstrap file; restore admin"
        - alert: EdgeProxyOverloaded
          expr: rate(edge_rejected_total{ {{- $sel -}} ,reason=~"overloaded|streams_overloaded"}[5m]) > 0
          labels:
            severity: warning
          annotations:
            summary: Capacity limits hit; scale edges or raise MAX_*
        # Admin finds anomalies in the stats edges report; while edges can't
        # report, it can't notify.
        - alert: EdgeProxyStatsDropped
          expr: rate(edge_stats_dropped_total{ {{- $sel -}} }[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Edges can't report stats to admin, so anomaly notifications can't see them
            runbook_url: {{ $runbooks }}#admin-or-postgres-down
        - alert: EdgeProxyPanics
          expr: increase(edge_background_panics_total{ {{- $sel -}} }[10m]) > 0 or increase(edge_rejected_total{ {{- $sel -}} ,reason="panic"}[10m]) > 0
          labels:
            severity: critical
          annotations:
            summary: The edge recovered from a panic; collect logs and report it
        # No admin leader changes no traffic, but nothing runs the guard,
        # notifications, JWKS refresh or audit checks. vector(0) also fires it
        # when no admin replica is scraped.
        - alert: EdgeProxyAdminNoLeader
          expr: (max(admin_leader{ {{- $adminSel -}} }) or vector(0)) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: No admin replica runs background jobs; check admin logs for leader loop, and Postgres
        - alert: EdgeProxyAdminLeaderFlapping
          expr: sum(changes(admin_leader{ {{- $adminSel -}} }[30m])) > 4
          labels:
            severity: warning
          annotations:
            summary: Admin leadership keeps moving, so background jobs keep restarting; check the leader's Postgres connection
        - alert: EdgeProxyAdminAuditVerifyFailed
          expr: increase(admin_audit_verify_failures_total{ {{- $adminSel -}} }[1h]) > 0
          labels:
            severity: critical
          annotations:
            summary: The audit chain is broken, or the audit key is wrong; check the audit chain broken log line
        - alert: EdgeProxyAdminJobFailures
          expr: increase(admin_background_job_failures_total{ {{- $adminSel -}} }[30m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Admin job {{ "{{" }} $labels.exported_job {{ "}}" }} failed; check the background job failed log line"
{{- end }}
