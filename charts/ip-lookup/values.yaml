# Default values for ip-lookup.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: chrisleekr/ip-lookup
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "ip-lookup"

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 3000

# Gateway API route, replacing the removed Ingress. HTTPRoute is portable across
# conformant gateways, so nothing here names an implementation.
route:
  # Off by default: a route needs a parentRef naming a Gateway, or a ListenerSet
  # on Gateway API v1.5.0 and later, that already exists in the cluster, and no
  # chart can guess one. Enabling without it fails the render deliberately.
  enabled: false
  # Set sectionName to the HTTPS listener. Without it the route attaches to
  # every listener on the Gateway, plain HTTP included.
  parentRefs: []
  # Optional. An empty list inherits the parent listener's hostname, which is
  # correct when that listener already serves exactly this host.
  hostnames: []
  # Metadata only. nginx.ingress.kubernetes.io/* annotations have no effect on
  # an HTTPRoute; express headers, redirects and rewrites as rules[].filters.
  annotations: {}
  # Empty renders one catch-all rule to this chart's Service. Set it to take
  # full control; matches and filters pass through verbatim.
  # The removed Ingress set these security headers through an nginx snippet by
  # default; the route drops them unless set here. ResponseHeaderModifier is
  # Extended support in Gateway API, so confirm the gateway implements it.
  # backendRefs name is this chart's fullname, see `helm template`.
  # rules:
  #   - backendRefs:
  #       - name: ip-lookup
  #         port: 3000
  #     filters:
  #       - type: ResponseHeaderModifier
  #         responseHeaderModifier:
  #           set:
  #             - name: X-Frame-Options
  #               value: DENY
  #             - name: X-Content-Type-Options
  #               value: nosniff
  #             # OWASP: set "0". The legacy XSS filter can itself introduce XSS.
  #             - name: X-XSS-Protection
  #               value: "0"
  rules: []

# Manifests passed through tpl, for anything outside Gateway API: a cert-manager
# Certificate for the listener, an authorization policy, a ListenerSet.
# A literal `{{` must be escaped, e.g. {{ "{{" }}.
extraObjects: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Pod topology spread constraints
topologySpreadConstraints: []

# Additional volumes on the output Deployment definition.
volumes:
  - name: npm-cache
    emptyDir: {}
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: npm-cache
    mountPath: "/home/node/.npm"
    readOnly: false
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
