apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-app.fullname" . }}-config
  labels:
    {{- include "github-app.labels" . | nindent 4 }}
data:
  # Non-secret env vars. Each optional key is gated by `ne <val> ""` so empty
  # values become "not set" at the pod level and src/config.ts Zod applies
  # its own defaults or surfaces its own "required when X" errors.
  # Field order mirrors the numbered groups in src/config.ts.
  {{- $c := .Values.config }}

  # --- 2. AI provider selection ---
  CLAUDE_PROVIDER: {{ $c.provider | quote }}
  {{- if $c.model }}
  CLAUDE_MODEL: {{ $c.model | quote }}
  {{- end }}

  # --- 4. AWS Bedrock credentials (non-secret subset) ---
  {{- if $c.awsRegion }}
  AWS_REGION: {{ $c.awsRegion | quote }}
  {{- end }}
  {{- if $c.awsProfile }}
  AWS_PROFILE: {{ $c.awsProfile | quote }}
  {{- end }}
  {{- if $c.anthropicBedrockBaseUrl }}
  ANTHROPIC_BEDROCK_BASE_URL: {{ $c.anthropicBedrockBaseUrl | quote }}
  {{- end }}

  # --- 5. App runtime / behaviour ---
  CLONE_BASE_DIR: {{ $c.cloneBaseDir | quote }}
  CLONE_DEPTH: {{ $c.cloneDepth | quote }}
  TRIGGER_PHRASE: {{ $c.triggerPhrase | quote }}
  BOT_APP_LOGIN: {{ $c.botAppLogin | quote }}
  PORT: {{ $c.port | quote }}
  LOG_LEVEL: {{ $c.logLevel | quote }}
  NODE_ENV: {{ $c.nodeEnv | quote }}
  MAX_CONCURRENT_REQUESTS: {{ $c.maxConcurrentRequests | quote }}
  MAX_FETCHED_COMMENTS: {{ $c.maxFetchedComments | quote }}
  MAX_FETCHED_REVIEWS: {{ $c.maxFetchedReviews | quote }}
  MAX_FETCHED_REVIEW_COMMENTS: {{ $c.maxFetchedReviewComments | quote }}
  MAX_FETCHED_FILES: {{ $c.maxFetchedFiles | quote }}
  AGENT_TIMEOUT_MS: {{ int $c.agentTimeoutMs | quote }}
  {{- if ne ($c.agentMaxTurns | toString) "" }}
  AGENT_MAX_TURNS: {{ $c.agentMaxTurns | quote }}
  {{- end }}
  {{- if $c.claudeCodePath }}
  CLAUDE_CODE_PATH: {{ $c.claudeCodePath | quote }}
  {{- end }}
  {{- if $c.allowedOwners }}
  ALLOWED_OWNERS: {{ $c.allowedOwners | quote }}
  {{- end }}
  {{- if $c.autoReviewUsers }}
  AUTO_REVIEW_USERS: {{ $c.autoReviewUsers | quote }}
  {{- end }}

  # --- 6. Orchestrator ---
  WS_PORT: {{ $c.wsPort | quote }}

  # --- 7. Daemon / Orchestrator WebSocket ---
  {{- if $c.orchestratorUrl }}
  {{- fail "config.orchestratorUrl must not be set on the orchestrator — presence of ORCHESTRATOR_URL flips it into daemon mode. Use daemon.orchestratorUrl or per-pool daemon.pools.<name>.orchestratorUrl instead." }}
  {{- end }}
  HEARTBEAT_INTERVAL_MS: {{ $c.heartbeatIntervalMs | quote }}
  HEARTBEAT_TIMEOUT_MS: {{ $c.heartbeatTimeoutMs | quote }}
  STALE_EXECUTION_THRESHOLD_MS: {{ int $c.staleExecutionThresholdMs | quote }}
  DAEMON_DRAIN_TIMEOUT_MS: {{ int $c.daemonDrainTimeoutMs | quote }}
  JOB_MAX_RETRIES: {{ $c.jobMaxRetries | quote }}
  WORKFLOW_DISPATCH_TIMEOUT_MS: {{ int $c.workflowDispatchTimeoutMs | quote }}
  OFFER_TIMEOUT_MS: {{ $c.offerTimeoutMs | quote }}
  QUEUE_WORKER_BACKOFF_MAX_MS: {{ int $c.queueWorkerBackoffMaxMs | quote }}
  LIVENESS_REAPER_INTERVAL_MS: {{ int $c.livenessReaperIntervalMs | quote }}
  DAEMON_UPDATE_STRATEGY: {{ $c.daemonUpdateStrategy | quote }}
  DAEMON_UPDATE_DELAY_MS: {{ $c.daemonUpdateDelayMs | quote }}
  DAEMON_MEMORY_FLOOR_MB: {{ $c.daemonMemoryFloorMb | quote }}
  DAEMON_DISK_FLOOR_MB: {{ $c.daemonDiskFloorMb | quote }}

  # --- 8. Ephemeral daemon (K8s-spawned scale-up) ---
  # The orchestrator itself is never ephemeral; only orchestrator-spawned Pods
  # set DAEMON_EPHEMERAL=true on their own container spec.
  DAEMON_EPHEMERAL: "false"
  EPHEMERAL_DAEMON_IDLE_TIMEOUT_MS: {{ $c.ephemeralDaemon.idleTimeoutMs | quote }}
  EPHEMERAL_DAEMON_SPAWN_COOLDOWN_MS: {{ $c.ephemeralDaemon.spawnCooldownMs | quote }}
  EPHEMERAL_DAEMON_SPAWN_QUEUE_THRESHOLD: {{ $c.ephemeralDaemon.spawnQueueThreshold | quote }}
  {{- $daemonNs := default .Release.Namespace $c.ephemeralDaemon.namespace }}
  EPHEMERAL_DAEMON_NAMESPACE: {{ $daemonNs | quote }}
  {{- with $c.ephemeralDaemon.secretName }}
  # Left unrendered when empty so the app owns the default name, not the chart.
  # Upstream envFrom-mounts this Secret onto Pods that run agent-authored code, so
  # naming one of the chart's own Secrets here would hand those Pods either the
  # GitHub App private key or the runner capability signing root. Only checkable
  # when the daemons land in the release namespace, where those Secrets live.
  {{- if and (eq $daemonNs $.Release.Namespace) (has . (list (include "github-app.secretName" $) (include "github-app.controllerSecretName" $))) }}
  {{- fail (printf "config.ephemeralDaemon.secretName=%q names a Secret this chart renders for the controller. Ephemeral daemon Pods envFrom-mount it and run agent-authored code, so the GitHub App private key or the workflow-runner capability root would reach a worker. Point it at a daemon-only Secret." .) }}
  {{- end }}
  EPHEMERAL_DAEMON_SECRET_NAME: {{ . | quote }}
  {{- end }}
  DAEMON_IMAGE: {{ default (include "github-app.image.daemon" (dict "root" .)) $c.ephemeralDaemon.image | quote }}
  {{- if $c.ephemeralDaemon.orchestratorPublicUrl }}
  ORCHESTRATOR_PUBLIC_URL: {{ $c.ephemeralDaemon.orchestratorPublicUrl | quote }}
  {{- end }}

  # --- 8a. Isolated workflow runners (K8s-spawned per-attempt Pods) ---
  # Two ways to reach the same four env vars, because the chart supports both
  # halves of the feature:
  #   workflowRunner.*        the chart provisions the rail (namespace, RBAC,
  #                           NetworkPolicy, admission policy) and must pin the
  #                           boundary from the same values the controller gets.
  #   config.workflowRunner.* published passthrough for an operator who built the
  #                           rail themselves; each key empty inherits the app default.
  # Rendered here rather than in the runner templates so the env-parity gate,
  # which greps only this file plus the two Secrets and daemon-deployment, can see them.
  {{- $rn := .Values.workflowRunner }}
  {{- $cr := default dict $c.workflowRunner }}
  # The runner/ephemeral-daemon namespace collision that upstream's
  # validateWorkerNamespaces refuses to boot on is guarded once, in
  # workflow-runner-namespace.yaml, off the shared github-app.runnerNamespace
  # helper. Helm renders that template first and aborts on the first fail, so a
  # second copy here would be unreachable and the two could drift apart.
  {{- if $rn.enabled }}
  # The provisioning values are the single source of truth while the chart owns
  # the rail: the same .Values feed the runner boundary ConfigMap, and any
  # disagreement between controller env and the admission policy denies every
  # runner Pod. So reject a conflicting passthrough value rather than ignore it.
  {{- range $k, $v := dict "namespace" $rn.namespace "nodeLabel" $rn.nodeLabel "nodeValue" $rn.nodeValue "imagePullSecret" $rn.imagePullSecret }}
  {{- $override := index $cr $k }}
  {{- if and $override (ne ($override | toString) ($v | toString)) }}
  {{- fail (printf "config.workflowRunner.%s=%q conflicts with workflowRunner.%s=%q. With workflowRunner.enabled=true the chart pins the admission boundary from workflowRunner.*, so a differing config.workflowRunner.* value would make the controller and the policy disagree and every runner Pod would be denied at admission. Unset one of them." $k ($override | toString) $k ($v | toString)) }}
  {{- end }}
  {{- end }}
  WORKFLOW_RUNNER_NAMESPACE: {{ $rn.namespace | quote }}
  WORKFLOW_RUNNER_NODE_LABEL: {{ $rn.nodeLabel | quote }}
  WORKFLOW_RUNNER_NODE_VALUE: {{ $rn.nodeValue | quote }}
  WORKFLOW_RUNNER_IMAGE_PULL_SECRET: {{ $rn.imagePullSecret | quote }}
  {{- else }}
  {{- if $cr.namespace }}
  WORKFLOW_RUNNER_NAMESPACE: {{ $cr.namespace | quote }}
  {{- end }}
  {{- if $cr.nodeLabel }}
  WORKFLOW_RUNNER_NODE_LABEL: {{ $cr.nodeLabel | quote }}
  {{- end }}
  {{- if $cr.nodeValue }}
  WORKFLOW_RUNNER_NODE_VALUE: {{ $cr.nodeValue | quote }}
  {{- end }}
  {{- if $cr.imagePullSecret }}
  WORKFLOW_RUNNER_IMAGE_PULL_SECRET: {{ $cr.imagePullSecret | quote }}
  {{- end }}
  {{- end }}

  # --- 9. Triage (binary heavy classifier) ---
  TRIAGE_ENABLED: {{ $c.triageEnabled | quote }}
  TRIAGE_TOOLS_ENABLED: {{ $c.triageToolsEnabled | quote }}
  TRIAGE_MODEL: {{ $c.triageModel | quote }}
  DISCUSSION_DIGEST_MODEL: {{ $c.digestModel | quote }}
  TRIAGE_CONFIDENCE_THRESHOLD: {{ $c.triageConfidenceThreshold | quote }}
  TRIAGE_MAX_TOKENS: {{ $c.triageMaxTokens | quote }}
  TRIAGE_TIMEOUT_MS: {{ $c.triageTimeoutMs | quote }}
  INTENT_CONFIDENCE_THRESHOLD: {{ $c.intentConfidenceThreshold | quote }}

  # --- 10a. Chat-thread executor (conversational scoped intent) ---
  CHAT_THREAD_EXECUTE_THRESHOLD: {{ $c.chatThreadExecuteThreshold | quote }}
  CHAT_THREAD_PROPOSAL_TTL_HOURS: {{ $c.chatThreadProposalTtlHours | quote }}
  CHAT_THREAD_MAX_TURNS: {{ $c.chatThreadMaxTurns | quote }}
  CHAT_THREAD_TOOLS_ENABLED: {{ $c.chatThreadToolsEnabled | quote }}

  # --- 10b. LLM-based output scanner (defense layer 4) ---
  LLM_OUTPUT_SCANNER_ENABLED: {{ $c.llmOutputScannerEnabled | quote }}
  LLM_OUTPUT_SCANNER_MODEL: {{ $c.llmOutputScannerModel | quote }}
  LLM_OUTPUT_SCANNER_TIMEOUT_MS: {{ int $c.llmOutputScannerTimeoutMs | quote }}

  # --- 10. Agent max turns ---
  {{- if ne ($c.defaultMaxTurns | toString) "" }}
  DEFAULT_MAXTURNS: {{ $c.defaultMaxTurns | quote }}
  {{- end }}

  # --- 12. Composite ship review/resolve loop ---
  {{- if ne ($c.reviewResolveMaxIterations | toString) "" }}
  REVIEW_RESOLVE_MAX_ITERATIONS: {{ $c.reviewResolveMaxIterations | quote }}
  {{- end }}

  # --- 12a. Prompt cache layout ---
  PROMPT_CACHE_LAYOUT: {{ $c.promptCacheLayout | quote }}

  # --- 13. Ship workflow (PR shepherding to merge-ready) ---
  MAX_WALL_CLOCK_PER_SHIP_RUN: {{ $c.maxWallClockPerShipRun | quote }}
  MAX_SHIP_ITERATIONS: {{ $c.maxShipIterations | quote }}
  CRON_TICKLE_INTERVAL_MS: {{ $c.cronTickleIntervalMs | quote }}
  MERGEABLE_NULL_BACKOFF_MS_LIST: {{ $c.mergeableNullBackoffMsList | quote }}
  REVIEW_BARRIER_SAFETY_MARGIN_MS: {{ int $c.reviewBarrierSafetyMarginMs | quote }}
  FIX_ATTEMPTS_PER_SIGNATURE_CAP: {{ $c.fixAttemptsPerSignatureCap | quote }}
  {{- if $c.shipForbiddenTargetBranches }}
  SHIP_FORBIDDEN_TARGET_BRANCHES: {{ $c.shipForbiddenTargetBranches | quote }}
  {{- end }}

  # --- 14. Scheduled actions + review-learnings ---
  SCHEDULER_ENABLED: {{ $c.schedulerEnabled | quote }}
  SCHEDULER_SCAN_INTERVAL_MS: {{ int $c.schedulerScanIntervalMs | quote }}
  SCHEDULER_ALLOW_AUTO_MERGE: {{ $c.schedulerAllowAutoMerge | quote }}
  # Both gated: the app reads REPO_CONFIG_FILE first and falls back to the
  # deprecated SCHEDULER_CONFIG_FILE, so rendering REPO_CONFIG_FILE with a chart
  # default would silently override a pre-1.17 schedulerConfigFile override.
  {{- if $c.repoConfigFile }}
  REPO_CONFIG_FILE: {{ $c.repoConfigFile | quote }}
  {{- end }}
  {{- if $c.schedulerConfigFile }}
  SCHEDULER_CONFIG_FILE: {{ $c.schedulerConfigFile | quote }}
  {{- end }}
  REVIEW_LEARNINGS_ENABLED: {{ $c.reviewLearningsEnabled | quote }}
  REVIEW_LEARNINGS_RAG_ENABLED: {{ $c.reviewLearningsRagEnabled | quote }}
