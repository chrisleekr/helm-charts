{{- $s := .Values.secrets }}
{{- if and $s.existingControllerSecret (or $s.workflowRunnerCapabilitySecret $s.workflowRunnerCapabilitySecretPrevious) }}
{{- fail "secrets.existingControllerSecret is set, so the chart renders no controller Secret and secrets.workflowRunnerCapabilitySecret[Previous] would be silently ignored. During a rotation that looks like a working config right up to the point every capability signed with the previous root is rejected. Put both keys in the named Secret, or unset existingControllerSecret." }}
{{- end }}
{{- /*
  Upstream config.ts refuses to boot with "Workflow runner capability roots must
  differ from daemon authentication roots". Only inline values can collide: the
  generated path draws independent randoms, and compact drops the empty slots.
*/}}
{{- range $cap := (list $s.workflowRunnerCapabilitySecret $s.workflowRunnerCapabilitySecretPrevious | compact) }}
{{- if has $cap (list $s.daemonAuthToken $s.daemonAuthTokenPrevious | compact) }}
{{- fail "secrets.workflowRunnerCapabilitySecret[Previous] must differ from secrets.daemonAuthToken[Previous]. The controller refuses to boot with \"Workflow runner capability roots must differ from daemon authentication roots\", and reusing one root across both trust domains lets a daemon-auth holder mint runner capabilities." }}
{{- end }}
{{- end }}
{{- if not $s.existingControllerSecret }}
{{- $name := include "github-app.controllerSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "github-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
type: Opaque
data:
  # Controller-only keys, mounted on the orchestrator Deployment and nothing
  # else. The shared app Secret (secret.yaml) is envFrom-mounted on every daemon
  # pool, and upstream's K8s Secret split (docs/operate/configuration.md) keeps
  # the runner-capability signing root off workers: a shared daemon that sees it
  # logs a leak warning, an isolated runner refuses to start.
  #
  # Always rendered: v1.17.0 config.ts rejects controller boot without
  # WORKFLOW_RUNNER_CAPABILITY_SECRET, so it gets the same lookup-backed
  # generation as DAEMON_AUTH_TOKEN. Independent randoms also satisfy the
  # upstream rule that capability roots differ from daemon-auth roots.
  WORKFLOW_RUNNER_CAPABILITY_SECRET: {{ include "github-app.stableToken" (dict "key" "WORKFLOW_RUNNER_CAPABILITY_SECRET" "secretName" $name "override" $s.workflowRunnerCapabilitySecret "root" .) | b64enc | quote }}
  {{- if $s.workflowRunnerCapabilitySecretPrevious }}
  WORKFLOW_RUNNER_CAPABILITY_SECRET_PREVIOUS: {{ $s.workflowRunnerCapabilitySecretPrevious | b64enc | quote }}
  {{- end }}
{{- end }}
