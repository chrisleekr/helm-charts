{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "github-app.serviceAccountName" . }}
  labels:
    {{- include "github-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

{{- /*
Daemon identities. workflow-runner-rbac.yaml refuses to bind the runner Role
while any enabled pool still resolves to the controller ServiceAccount, so
turning the rail on with daemon pools forces a distinct name here. Nothing
created that name before, and a missing ServiceAccount is not a render error:
the Deployment applies and every Pod is rejected with `serviceaccounts "x" not
found`, leaving replicas at 0 with only a ReplicaSet event.

Opt-in rather than automatic, because daemon.serviceAccount.name predates this
and an operator already creating that ServiceAccount out of band would hit an
ownership conflict on upgrade if the chart started claiming it.

No token is mounted: only the controller calls the Kubernetes API, and these
Pods run agent-authored code.
*/ -}}
{{- if and .Values.serviceAccount.create .Values.daemon.serviceAccount.create }}
{{- $controllerSA := include "github-app.serviceAccountName" . }}
{{- $seen := list }}
{{- range $poolName, $pool := .Values.daemon.pools }}
{{- if ne ($pool.enabled | toString) "false" }}
{{- $sa := include "github-app.daemon.serviceAccountName" (dict "root" $ "pool" $pool) }}
{{- if and (ne $sa $controllerSA) (not (has $sa $seen)) }}
{{- $seen = append $seen $sa }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "github-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: daemon
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- end }}
{{- end }}
