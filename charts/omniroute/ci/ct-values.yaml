# Values for chart-testing (ct) install and CI `helm template` / `helm lint`.
# Supplies the required initial dashboard password so rendering and installation
# succeed in CI without a real secret. Not for production use.
auth:
  initialPassword: "ci-test-password-do-not-use"

# Gateway API surface, folded in rather than shipped as its own fixture: this
# chart fails to render without the auth values above, and the schema gate
# renders every ci fixture on its own.
route:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - omniroute.ci.example.com
