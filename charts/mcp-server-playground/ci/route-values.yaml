# Renders the Gateway API surface so the schema gate and ct actually validate an
# HTTPRoute. Without a fixture the chart would only ever be rendered with
# defaults, where the route is off and nothing would be checked. rules is unset
# so the default backendRef to <fullname>-service is proven; see
# route-rules-values.yaml for explicit rules.
route:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: gateway-system
      sectionName: https
  hostnames:
    - mcp.ci.example.com
