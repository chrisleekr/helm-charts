publish-devel:
  stage: publish
  image:
    name: alpine/helm:3.20.0
    # The image sets ENTRYPOINT ["helm"]. The Docker executor does not override
    # an image entrypoint; it passes the job script as the container CMD, so the
    # container would run `helm sh -c '<script>'` and fail before this job's
    # first line. An empty entrypoint restores the shell.
    # https://docs.gitlab.com/runner/executors/docker/#configure-a-docker-entrypoint
    entrypoint: [""]
  # Not interruptible: a cancelled publish leaves the merge with no package.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # The changed-chart diff reaches back to the commit before the push, which
    # the runner's default depth of 20 can cut out on a large merge.
    # https://docs.gitlab.com/ci/runners/configure_runners/#shallow-cloning
    GIT_DEPTH: "0"
  script:
    - |
      set -eu
      # pipefail so a failing git diff below is fatal. Without it the pipeline
      # reports the exit status of `sort`, the chart list comes out empty, and
      # the job publishes nothing while still exiting 0.
      set -o pipefail
      # CI_COMMIT_BEFORE_SHA is the previous tip of main, so a push landing
      # several commits is covered, not just the last one. It is all zeros on a
      # manually run pipeline, and this project has had web-source pipelines.
      # https://docs.gitlab.com/ci/variables/predefined_variables/
      base="$CI_COMMIT_BEFORE_SHA"
      if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
        base="HEAD~1"
      fi
      # Assigned rather than expanded straight into the `for` word list: a
      # command substitution there has its exit status discarded, so set -e and
      # pipefail can only observe the failure through an assignment.
      changed=$(git diff --name-only "$base" HEAD -- charts/ | cut -d/ -f2 | sort -u)
      for name in $changed; do
        # A deleted chart still shows in the diff.
        [ -f "charts/$name/Chart.yaml" ] || continue
        # Same rule as the "Withhold placeholder-appVersion charts" step in
        # .github/workflows/release.yml. devel is a prerelease channel, but a
        # chart whose appVersion is still the 0.0.0 bootstrap placeholder points
        # at an image tag that does not exist, so it is uninstallable on either
        # host. Its <name>-sync workflow replaces the placeholder on the first
        # public release and publishing resumes.
        appversion=$(yq e '.appVersion' "charts/$name/Chart.yaml" | tr -d '"')
        if [ "$appversion" = "0.0.0" ]; then
          echo "withholding $name from devel: appVersion is the 0.0.0 placeholder"
          continue
        fi
        version=$(yq e '.version' "charts/$name/Chart.yaml")
        # helm names the archive after Chart.yaml .name, not after the
        # directory. They match today; reading both keeps the curl --form path
        # correct if one ever diverges.
        chartname=$(yq e '.name' "charts/$name/Chart.yaml")
        # One prerelease identifier, "dev-<sha>", not "dev.<sha>". A short SHA
        # can be all digits, and SemVer rejects a numeric identifier with a
        # leading zero, which helm would refuse to package.
        devel="${version}-dev-${CI_COMMIT_SHORT_SHA}"
        helm package "charts/$name" --version "$devel" --destination .
        # GitLab treats a channel as a separate repository, so "devel" can never
        # be resolved by anything pointed at stable. CI_JOB_TOKEN is accepted
        # here, which avoids installing the chartmuseum/helm-push plugin.
        # https://docs.gitlab.com/user/packages/helm_repository/
        curl --fail-with-body --request POST \
          --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
          --form "chart=@${chartname}-${devel}.tgz" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/devel/charts"
      done
